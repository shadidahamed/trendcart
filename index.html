<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="p:domain_verify" content="23f7f68c4b01e437afae5ce3df1c184a"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrendCart</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>TrendCart</h1>

  <div class="top-controls">
    <input type="text" id="searchInput" placeholder="Search on Amazon...">
    <button id="searchBtn">Search</button>
    <button id="settingsBtn">⚙</button>
  </div>
</header>

<!-- SETTINGS PANEL -->
<div id="settingsPanel" class="settings hidden">
  <h3>Settings</h3>
  <button id="toggleTheme">Toggle Dark Mode</button>
  <button id="toggleLanguage">ENG / BAN</button>
</div>

<!-- CATEGORY NAV -->
<nav class="category-nav">
<h1>   <button onclick="showCategory('books')">Books</button>
  <button onclick="showCategory('electronics')">Electronics</button>
  <button onclick="showCategory('clothing')">Clothing</button> </h1>
</nav>

<main>

<!-- ELECTRONICS -->
<section id="electronicsSection" class="category-section">
  <h2>Electronics</h2>
  <div class="subcategories">
    <button onclick="filterSub('electronics','kitchen')">Kitchen</button>
    <button onclick="filterSub('electronics','desining')">Digital Desining Tools</button>
    <button onclick="filterSub('electronics','gaming')">Gaming</button>
    <button onclick="filterSub('electronics','recreation')">Recration</button>
  </div>
  <div class="product-grid" id="electronicsGrid"></div>
</section>

<!-- BOOKS -->
<section id="booksSection" class="category-section hidden">
  <h2>Books</h2>
  <div class="subcategories">
    <button onclick="filterSub('books','manga')">Manga</button>
    <button onclick="filterSub('books','webnovel')">Web Novel</button>
    <button onclick="filterSub('books','fiction')">Fiction</button>
     <button onclick="filterSub('books','educational')">Educational</button>
    <button onclick="filterSub('books','dark psychology')">Dark Psychology</button>
  </div>
  <div class="product-grid" id="booksGrid"></div>
</section>

<!-- CLOTHING -->
<section id="clothingSection" class="category-section hidden">
  <h2>Clothing</h2>
  <div class="subcategories">
    <button onclick="filterSub('clothing','men')">Men</button>
    <button onclick="filterSub('clothing','women')">Women</button>
    <button onclick="filterSub('clothing','kids')">Kids</button>
  </div>
  <div class="product-grid" id="clothingGrid"></div>
</section>

</main>

<script src="app.js" defer></script>
</body>
</html>
