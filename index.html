<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TrendCart – Trending Products</title>
  <meta name="description" content="TrendCart brings you trending products people love. Discover the best deals, new arrivals, and top sellers." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
  <script src="app.js" defer></script>
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="main-header">
  <div class="header-top">
    <div class="lang-switch">
<button id="langBtn">ENG</button>
    </div>
    <button id="currencyBtn">USD</button>
  </div>

  <div class="header-container">
    <a href="/" class="logo">TrendCart</a>

    <!-- Mobile Menu Toggle -->
    <button class="menu-toggle" aria-label="Toggle menu">☰</button>

    <nav class="navbar">
      <ul class="nav-items" id="categoryMenu">
        <!-- Categories injected by app.js -->
      </ul>
    </nav>

    <div class="header-actions">
     <button id="loginBtn">Login</button>
   <button id="cartBtn">Cart (0)</button>
    </div>
  </div>
</header>

<!-- ================= HERO ================= -->
<section class="hero">
  <h1 id="tagline">Trending products people love 🔥</h1>
  <p>Curated picks • Best prices • Trusted reviews</p>
</section>

<input type="text" id="searchInput" placeholder="Search products...">
<button id="searchBtn">Search</button>

<!-- ================= MAIN ================= -->
<main class="container">
<h2 id="electronicsTitle">Electronics</h2>
<div class="product-grid" id="electronicsGrid"></div>

<h2 id="booksTitle">Books</h2>
<div class="product-grid" id="booksGrid"></div>

<h2 id="clothingTitle">Clothing</h2>
<div class="product-grid" id="clothingGrid"></div>
</main>
<!-- ================= FOOTER ================= -->
<footer class="footer">
  <p>© 2026 TrendCart. This site contains affiliate links.</p>
</footer>

</body>
</html>
