<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TrendCart Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <script src="admin.js" defer></script>
</head>
<body>
  <h1>TrendCart Admin Panel</h1>

  <form id="addProductForm">
    <input type="text" id="title" placeholder="Product Title" required />
    <input type="number" id="priceUSD" placeholder="Price USD" required />
    <select id="category" required>
      <option value="">Select Category</option>
      <option value="Electronics">Electronics</option>
      <option value="Books">Books</option>
      <option value="Clothing">Clothing</option>
    </select>
    <input type="url" id="image" placeholder="Image URL" required />
    <input type="url" id="affiliate" placeholder="Affiliate URL {{replace with real Amazon link}}" required />
    <button type="submit">Add Product</button>
  </form>

  <div id="status"></div>
</body>
</html>
