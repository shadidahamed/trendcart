<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TrendCart Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <script src="admin.js" defer></script>
</head>
<body>
  <h1>TrendCart Admin Panel</h1>

  <form id="addProductForm">
    <input type="text" id="title" placeholder="Product Title" required />
    <input type="number" id="priceUSD" placeholder="Price USD" required />
    <select id="category" required>
      <option value="">Select Category</option>
      <option value="Electronics">Electronics</option>
      <option value="Books">Books</option>
      <option value="Clothing">Clothing</option>
    </select>
    <input type="url" id="image" placeholder="https://m.media-amazon.com/images/I/81fgp4Q3F8L._SL1500_.jpg"
 required />
    <input type="url" id="affiliate" placeholder="https://www.amazon.com/Jujutsu-Kaisen-Books-Collection-Akutami/dp/B07XLKMW1L?crid=CQ66ZSABVH22&dib=eyJ2IjoiMSJ9.KAdWHKrrmwmNGsgcd7a2aYHorle3WmImSdJtIvrd9TUv18uf3IcDBuA6gmbI3NpujLsvLrXStqr6vtfReGtf90-r_UDPyL2nuEXd5P4BIoCdE65q1yBrZLkN6l6nus6m2xJP-ZGlm84wes3kaYwzmo1arniQ101djeQovkGtgtH0iYif_Ghenksnnn7HFpQsL5Y7py-nhdGFkqSdZ2x1_aLSbLOISZCkUgAdnjZtG7I.M6MlcnYrerHv0N7XT5FHempbFYL8rSKjuVs8-wwItGM&dib_tag=se&keywords=jjk+manga+box+set&qid=1771783076&sprefix=jjk%2Caps%2C477&sr=8-1&linkCode=ll2&tag=trendcartbd-20&linkId=737be39143b1a39391c852cd5a649329&language=en_US&ref_=as_li_ss_tl"
required />
    <button type="submit">Add Product</button>
  </form>

  <div id="status"></div>
</body>
</html>
